<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#8bcbb2" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <title>オフラインです｜美雪のねこカフェ</title>
    <style>
      * { box-sizing: border-box; }
      html { color-scheme: light; }
      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        color: #50372a;
        background:
          radial-gradient(circle at 16% 15%, rgba(255, 181, 193, 0.28) 0 8%, transparent 8.5%),
          radial-gradient(circle at 86% 85%, rgba(139, 203, 178, 0.32) 0 10%, transparent 10.5%),
          #fff9e9;
        font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", system-ui, sans-serif;
      }
      main {
        width: min(100%, 430px);
        padding: 28px 24px 24px;
        text-align: center;
        border: 3px solid #79553f;
        border-radius: 30px;
        background: rgba(255, 253, 244, 0.96);
        box-shadow: 0 16px 0 rgba(139, 203, 178, 0.28), 0 24px 50px rgba(79, 55, 42, 0.16);
      }
      img {
        width: 112px;
        height: 112px;
        object-fit: cover;
        border: 4px solid #ffb5c1;
        border-radius: 30px;
        background: #e8f6ee;
      }
      .eyebrow {
        display: inline-block;
        margin: 18px 0 4px;
        padding: 5px 12px;
        border-radius: 999px;
        background: #dff3e8;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      h1 { margin: 8px 0; font-size: clamp(1.6rem, 7vw, 2.15rem); line-height: 1.3; }
      p { margin: 0 auto 22px; max-width: 30em; font-size: 0.95rem; line-height: 1.8; }
      .actions { display: grid; gap: 10px; }
      button, a {
        display: grid;
        min-height: 48px;
        place-items: center;
        padding: 10px 18px;
        border: 2px solid #79553f;
        border-radius: 999px;
        color: #50372a;
        background: #fffdf4;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }
      button { background: #ffcad2; }
      button:focus-visible, a:focus-visible { outline: 4px solid #8bcbb2; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="./pwa/icon-192.png" alt="手をふるねこ" width="112" height="112" />
      <div class="eyebrow">OFFLINE MODE</div>
      <h1>いまは電波がおひるね中</h1>
      <p>つながったことのあるページなら、もどって遊べることがあります。電波が起きたら、もう一度ためしてね。</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">もう一度つなぐ</button>
        <a href="./#home">ねこカフェへもどる</a>
      </div>
    </main>
  </body>
</html>
